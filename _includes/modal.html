<!-- Modal window -->
<dialog id="project-modal" class="modal" aria-labelledby="project-modal-title">
    <div class="modal-content">
        <button class="modal-close" type="button" aria-label="Close project">&times;</button>
        <div class="modal-body">
            <h2 id="project-modal-title" class="modal-title"></h2>
            <div class="modal-external-links"></div>
            <div class="modal-description"></div>
        </div>
    </div>
</dialog>

<script>
    window.projectsData = {{ site.data.projects | jsonify }};
</script>

<script src="assets/js/modal.js?v={{ site.time | date: '%s' }}"></script>
